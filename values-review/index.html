<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Values Review | Equilibria Collective</title>
<meta name="description" content="A reflective values exercise from Equilibria Collective. Name your top three values, review how closely you have lived by them, and set actions for the month ahead.">
<style>
  :root {
    --paper-white: #f5f2e9;
    --peach: #f9b497;
    --apricot: #fd8157;
    --pistachio: #cedfbb;
    --green: #7a9e82;
    --blue: #639bab;
    --baby-blue: #bbdadf;
    --text: #3a352f;
    --text-muted: #7a7468;
    --serif: Georgia, "Times New Roman", serif;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background-color: var(--paper-white);
    color: var(--text);
    font-family: var(--sans);
    -webkit-text-size-adjust: 100%;
  }

  .page {
    position: relative;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .decor {
    position: absolute;
    top: 0;
    right: 0;
    opacity: 0.4;
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 28rem;
    margin: 0 auto;
    padding: 2rem 1.25rem 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .masthead { display: flex; flex-direction: column; align-items: center; }
  .masthead img { width: 220px; max-width: 100%; height: auto; display: block; }

  #content { flex: 1; padding-top: 2rem; }

  @keyframes vaFadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .va-fade { animation: vaFadeIn 0.28s ease-out; }

  h1.title {
    font-family: var(--serif);
    font-weight: 300;
    font-size: 2.1rem;
    margin: 0 0 1.25rem;
    text-align: center;
    line-height: 1.15;
  }
  h1.title.small { font-size: 1.7rem; margin-bottom: 0.2rem; }

  h2.value {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 1.7rem;
    margin: 0 0 0.4rem;
    line-height: 1.2;
  }
  h2.card-name { font-size: 1.6rem; margin-bottom: 0.75rem; }
  h2.notice { font-size: 1.5rem; margin-bottom: 1rem; }

  .lead { font-size: 0.95rem; line-height: 1.7; }
  .lead p { margin: 0 0 1rem; }
  .lead p:last-child { margin-bottom: 2rem; }

  .centre { text-align: center; }
  .muted { color: var(--text-muted); }

  .progress {
    margin-bottom: 1rem;
    text-align: center;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
  }

  .hint {
    margin: 0 0 1.5rem;
    text-align: center;
    font-size: 0.85rem;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .instruction {
    margin: 0 0 1.5rem;
    text-align: center;
    font-size: 0.95rem;
    line-height: 1.5;
  }

  .card {
    margin-bottom: 2rem;
    border-radius: 1.5rem;
    padding: 2.5rem 1.5rem;
    text-align: center;
    background-color: #ffffff;
    box-shadow: 0 10px 30px rgba(58, 53, 47, 0.08);
    border: 1px solid var(--pistachio);
  }
  .card p { margin: 0; font-size: 0.95rem; color: var(--text-muted); }

  .stack { display: flex; flex-direction: column; gap: 0.75rem; }

  button { font-family: var(--sans); cursor: pointer; }

  .btn {
    width: 100%;
    border-radius: 1rem;
    padding: 1rem 1.5rem;
    text-align: center;
    font-size: 1rem;
    transition: opacity 0.15s ease;
    color: var(--text);
  }
  .btn:hover:not(:disabled) { opacity: 0.88; }

  .btn-primary {
    font-weight: 700;
    border: none;
    background-color: var(--apricot);
    box-shadow: 0 6px 16px rgba(253, 129, 87, 0.28);
  }
  .btn-primary:disabled {
    background-color: #e4e0d4;
    color: var(--text-muted);
    box-shadow: none;
    cursor: not-allowed;
  }

  .btn-outline {
    font-weight: 600;
    background-color: transparent;
    border: 2px solid var(--text-muted);
  }
  .btn-outline.peach { border-color: var(--peach); }
  .btn-outline.blue { border-color: var(--blue); }

  .btn-filled {
    font-weight: 700;
    border: 2px solid var(--green);
    background-color: var(--green);
  }

  .link {
    background: none;
    border: none;
    padding: 0;
    text-decoration: underline;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .undo-row { margin-top: 1.25rem; text-align: center; min-height: 1.25rem; }

  .pills {
    margin-bottom: 2rem;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.625rem;
  }
  .pill {
    border-radius: 999px;
    padding: 0.625rem 1rem;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text);
    background-color: #ffffff;
    border: 1.5px solid var(--pistachio);
  }
  .pill[aria-pressed="true"] {
    background-color: var(--apricot);
    border-color: var(--apricot);
  }

  .scale {
    margin-bottom: 0.5rem;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 0.5rem;
  }
  .scale-btn {
    border-radius: 0.75rem;
    padding: 0.75rem 0;
    text-align: center;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text);
    background-color: #ffffff;
    border: 1.5px solid var(--pistachio);
  }
  .scale-btn[aria-pressed="true"] {
    background-color: var(--green);
    border-color: var(--green);
  }

  .scale-ends {
    margin-bottom: 1.5rem;
    display: flex;
    justify-content: space-between;
    padding: 0 0.25rem;
    font-size: 0.72rem;
    color: var(--text-muted);
  }

  label.field { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; }

  input[type="text"] {
    width: 100%;
    border-radius: 0.75rem;
    padding: 0.75rem 1rem;
    font-family: var(--sans);
    font-size: 0.9rem;
    color: var(--text);
    border: 1.5px solid var(--pistachio);
    background-color: #ffffff;
  }
  input.spaced { margin-bottom: 2rem; }

  .value-head { margin-bottom: 1.5rem; text-align: center; }
  .value-head p { margin: 0; font-size: 0.9rem; color: var(--text-muted); }

  .prompt { margin: 0 0 1rem; text-align: center; font-size: 0.95rem; }
  .brief { margin: 0 0 1.25rem; font-size: 0.9rem; line-height: 1.6; }

  .summary-list { margin-bottom: 2rem; display: flex; flex-direction: column; gap: 1.25rem; }
  .summary-card {
    border-radius: 1rem;
    padding: 1.25rem;
    background-color: #ffffff;
    border: 1px solid var(--pistachio);
  }
  .summary-card h3 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 1.25rem;
    margin: 0 0 0.3rem;
  }
  .summary-score {
    margin: 0 0 0.75rem;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--green);
  }
  .summary-reflection {
    margin: 0 0 0.75rem;
    font-size: 0.85rem;
    font-style: italic;
    line-height: 1.5;
  }
  .summary-label {
    margin: 0 0 0.25rem;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    text-transform: uppercase;
    font-weight: 600;
  }
  .summary-card ol {
    margin: 0;
    padding-left: 1.25rem;
    font-size: 0.88rem;
    line-height: 1.6;
  }

  .export-row { margin-bottom: 2rem; display: flex; gap: 0.75rem; }
  .export-row > * { flex: 1; }

  .closing { margin-bottom: 1.5rem; font-size: 0.9rem; line-height: 1.7; }
  .closing p { margin: 0 0 1rem; }
  .closing .question {
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.05rem;
    margin-bottom: 0;
  }

  .footer {
    margin-top: 2.5rem;
    padding: 0 1rem 1.5rem;
    text-align: center;
    font-size: 0.72rem;
    color: var(--text-muted);
    line-height: 1.5;
  }
  .footer p { margin: 0 0 0.5rem; }
  .footer p:last-child { margin-bottom: 0; }

  button:focus-visible, input:focus-visible, a:focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 2px;
  }

  html.embedded, html.embedded body { background-color: transparent; }
  html.embedded .page, html.embedded .wrap { min-height: 0; }
  html.embedded .wrap { padding-top: 1rem; }

  @media print {
    .decor, .export-row, .link { display: none; }
    .page { min-height: 0; }
  }
</style>
</head>

<div class="page">
  <svg class="decor" aria-hidden="true" width="160" height="160" viewBox="0 0 160 160">
    <circle cx="130" cy="20" r="34" fill="#cedfbb" opacity="0.5"></circle>
    <circle cx="150" cy="80" r="14" fill="#f9b497" opacity="0.6"></circle>
    <circle cx="100" cy="10" r="8" fill="#bbdadf" opacity="0.7"></circle>
  </svg>

  <div class="wrap">
    <header class="masthead">
      <img id="logo" alt="Equilibria Collective. A new balance for modern leadership.">
    </header>

    <main id="content"></main>

    <footer class="footer">
      <p>A reflective coaching exercise from Equilibria Collective. Nothing entered here is stored or sent anywhere. This tool supports self-reflection rather than providing therapy, counselling or clinical advice.</p>
      <p>Equilibria Collective Pty Limited (ACN 695 621 160).</p>
    </footer>
  </div>
</div>

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

var deck = shuffle(VALUES);

var S = {
  screen: "welcome",
  cardIndex: 0,
  decisions: new Array(deck.length).fill(null),
  narrowSteps: [],
  narrowStepIndex: 0,
  currentPool: [],
  selectedInPool: [],
  finalValues: [],

  alignment: {},

function reportHeight() {
  if (!embedded) return;
  var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
  if (!h || h < 200) return;
  try {
    window.parent.postMessage({ source: "values-review", height: h }, "*");
  } catch (e) { /* parent unreachable */ }
}

}

/* ============================== sort ============================== */

function sortChoice(decision) {
  S.decisions[S.cardIndex] = decision;
  if (S.cardIndex + 1 >= deck.length) {
    finishSort();
  } else {
    S.cardIndex++;
    render();
  }
}

function undoSort() {
  if (S.cardIndex === 0) return;
  S.decisions[S.cardIndex - 1] = null;
  S.cardIndex--;
  render();
}

function restartSort() {
  S.decisions = new Array(deck.length).fill(null);
  S.cardIndex = 0;
  S.screen = "sort";
  render();
}

function finishSort() {
  var pile = deck.filter(function (v, i) { return S.decisions[i] === "important"; });

  if (pile.length === 0) { S.screen = "emptyPile"; render(); return; }

  if (pile.length <= 3) {
    S.finalValues = pile;
    S.alignmentIndex = 0;
    S.screen = "alignment";
    render();
    return;
  }

  var steps;
  if (pile.length <= 5) {
    steps = [{ target: 3, instruction: "Last cut. Which three do you most want to lead your decisions?" }];
  } else if (pile.length <= 10) {
    steps = [
      { target: 5, instruction: "Now the harder cut. Choose the five you would not trade away." },
      { target: 3, instruction: "Last cut. Which three do you most want to lead your decisions?" }
    ];
  } else {
    steps = [
      { target: 10, instruction: "From the values you kept, choose the ten that matter most." },
      { target: 5, instruction: "Now the harder cut. Choose the five you would not trade away." },
      { target: 3, instruction: "Last cut. Which three do you most want to lead your decisions?" }
    ];
  }

  S.narrowSteps = steps;
  S.narrowStepIndex = 0;
  S.currentPool = pile;
  S.selectedInPool = [];
  S.screen = "narrow";
  render();
}

/* ============================= narrow ============================= */

function activeStep() { return S.narrowSteps[S.narrowStepIndex]; }

function togglePill(name) {
  var step = activeStep();
  var idx = S.selectedInPool.indexOf(name);
  if (idx >= 0) {
    S.selectedInPool.splice(idx, 1);
  } else {
    if (!step || S.selectedInPool.length >= step.target) return;
    S.selectedInPool.push(name);
  }
  refreshNarrow();
}

function refreshNarrow() {
  var step = activeStep();
  document.getElementById("narrowProgress").textContent =
    "Selected " + S.selectedInPool.length + " of " + step.target;
  var pills = content.querySelectorAll(".pill");
  for (var i = 0; i < pills.length; i++) {
    var n = pills[i].getAttribute("data-name");
    pills[i].setAttribute("aria-pressed", S.selectedInPool.indexOf(n) >= 0 ? "true" : "false");
  }
  document.getElementById("narrowContinue").disabled =
    S.selectedInPool.length !== step.target;
}

function narrowContinue() {
  var chosen = S.currentPool.filter(function (v) {
    return S.selectedInPool.indexOf(v.name) >= 0;
  });
  var next = S.narrowStepIndex + 1;
  if (next >= S.narrowSteps.length) {
    S.finalValues = chosen;
    S.alignmentIndex = 0;
    S.screen = "alignment";
  } else {
    S.currentPool = chosen;
    S.selectedInPool = [];
    S.narrowStepIndex = next;
  }
  render();
}

/* ============================ alignment =========================== */

function alignEntry() {
  var v = S.finalValues[S.alignmentIndex];
  if (!S.alignment[v.name]) S.alignment[v.name] = { score: null, reflection: "" };
  return S.alignment[v.name];
}

function setScore(n) {
  alignEntry().score = n;
  var btns = content.querySelectorAll(".scale-btn");
  for (var i = 0; i < btns.length; i++) {
    btns[i].setAttribute("aria-pressed", Number(btns[i].getAttribute("data-n")) === n ? "true" : "false");
  }
  document.getElementById("alignContinue").disabled = false;
}

function alignContinue() {
  if (S.alignmentIndex + 1 >= S.finalValues.length) {
    S.actionsIndex = 0;
    S.screen = "actions";
  } else {
    S.alignmentIndex++;
  }
  render();
}

/* ============================= actions ============================ */

function actionEntry() {
  var v = S.finalValues[S.actionsIndex];
  if (!S.actions[v.name]) S.actions[v.name] = ["", "", ""];
  return S.actions[v.name];
}

function actionsContinue() {
  if (S.actionsIndex + 1 >= S.finalValues.length) {
    S.screen = "summary";
  } else {
    S.actionsIndex++;
  }
  render();
}

/* ---------------- .docx export (no dependencies) ----------------
   A .docx is a ZIP of XML parts. We write entries uncompressed (store),
   so no deflate implementation is needed. */

var CRC_TABLE = (function () {
  var t = new Uint32Array(256);
  for (var n = 0; n < 256; n++) {
    var c = n;
    for (var k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  var c = 0xffffffff;
  for (var i = 0; i < bytes.length; i++) {
    c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  }
  return (c ^ 0xffffffff) >>> 0;
}

function utf8(str) {
  return new TextEncoder().encode(str);
}

function zipStore(entries) {
  var chunks = [];
  var central = [];
  var offset = 0;

  function u16(n) { return [n & 0xff, (n >>> 8) & 0xff]; }
  function u32(n) { return [n & 0xff, (n >>> 8) & 0xff, (n >>> 16) & 0xff, (n >>> 24) & 0xff]; }

  var now = new Date();
  var dosTime = ((now.getHours() & 0x1f) << 11) | ((now.getMinutes() & 0x3f) << 5) |
                ((now.getSeconds() / 2) & 0x1f);
  var dosDate = (((now.getFullYear() - 1980) & 0x7f) << 9) |
                (((now.getMonth() + 1) & 0x0f) << 5) | (now.getDate() & 0x1f);

  entries.forEach(function (e) {
    var nameBytes = utf8(e.name);
    var data = e.data;
    var crc = crc32(data);

    var local = [].concat(
      u32(0x04034b50), u16(20), u16(0x0800), u16(0),
      u16(dosTime), u16(dosDate),
      u32(crc), u32(data.length), u32(data.length),
      u16(nameBytes.length), u16(0)
    );
    chunks.push(new Uint8Array(local), nameBytes, data);

    central.push([].concat(
      u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0),
      u16(dosTime), u16(dosDate),
      u32(crc), u32(data.length), u32(data.length),
      u16(nameBytes.length), u16(0), u16(0),
      u16(0), u16(0), u32(0),
      u32(offset)
    ));
    central[central.length - 1].nameBytes = nameBytes;
    offset += local.length + nameBytes.length + data.length;
  });

  var cdStart = offset;
  var cdSize = 0;
  central.forEach(function (c) {
    chunks.push(new Uint8Array(c), c.nameBytes);
    cdSize += c.length + c.nameBytes.length;
  });

  chunks.push(new Uint8Array([].concat(
    u32(0x06054b50), u16(0), u16(0),
    u16(entries.length), u16(entries.length),
    u32(cdSize), u32(cdStart), u16(0)
  )));

  var total = chunks.reduce(function (n, c) { return n + c.length; }, 0);
  var out = new Uint8Array(total);
  var p = 0;
  chunks.forEach(function (c) { out.set(c, p); p += c.length; });
  return out;
}

function xmlEsc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&apos;");
}

/* ---- paragraph helpers (Equilibria Collective styling) ---- */

function para(text, opt) {

  var rPr = "<w:rPr>";
  rPr += '<w:rFonts w:ascii="' + (opt.font || "Arial") + '" w:hAnsi="' + (opt.font || "Arial") + '"/>';
  if (opt.bold) rPr += "<w:b/>";
  if (opt.italic) rPr += "<w:i/>";
  if (opt.caps) rPr += "<w:caps/>";
  if (opt.spacing) rPr += '<w:spacing w:val="' + opt.spacing + '"/>';
  rPr += '<w:color w:val="' + (opt.color || "3A352F") + '"/>';
  rPr += '<w:sz w:val="' + (opt.size || 22) + '"/><w:szCs w:val="' + (opt.size || 22) + '"/>';
  rPr += "</w:rPr>";

  var pPr = '<w:pPr><w:spacing w:before="' + (opt.before || 0) +
            '" w:after="' + (opt.after || 120) + '" w:line="276" w:lineRule="auto"/>';
  if (opt.align) pPr += '<w:jc w:val="' + opt.align + '"/>';
  if (opt.indent) pPr += '<w:ind w:left="' + opt.indent + '"/>';
  pPr += "</w:pPr>";

  return "<w:p>" + pPr + "<w:r>" + rPr +
         '<w:t xml:space="preserve">' + xmlEsc(text) + "</w:t></w:r></w:p>";
}

  var entries = [
    { name: "[Content_Types].xml", data: utf8(content_types) },
    { name: "_rels/.rels", data: utf8(root_rels) },
    { name: "word/document.xml", data: utf8(document_xml) },
    { name: "word/_rels/document.xml.rels", data: utf8(doc_rels) }
  ];
  if (logoBytes) entries.push({ name: "word/media/logo.png", data: logoBytes });

  return zipStore(entries);
}

/* ============================== export =========================== */

function buildExportText() {
  var lines = [];
  lines.push("VALUES REVIEW");
  lines.push("Equilibria Collective Pty Limited (ACN 695 621 160)");
  lines.push(todayLabel);
  lines.push("");
  S.finalValues.forEach(function (v) {
    var a = S.alignment[v.name] || {};
    var acts = (S.actions[v.name] || []).filter(function (x) { return x && x.trim(); });
    lines.push("VALUE: " + v.name);
    lines.push("Alignment last month: " + (a.score != null ? a.score : "") + "/10");
    if (a.reflection && a.reflection.trim()) lines.push("Reflection: " + a.reflection.trim());
    lines.push("Actions for the next month:");
    acts.forEach(function (act, i) { lines.push((i + 1) + ". " + act.trim()); });
    lines.push("");
  });
  return lines.join("\n").trim() + "\n";
}

function copyResults() {
  var text = buildExportText();
  var btn = document.getElementById("copyBtn");
  function flash() {
    btn.textContent = "Copied";
    setTimeout(function () { btn.textContent = "Copy results"; }, 2000);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(flash, fallback);
  } else {
    fallback();
  }
  function fallback() {
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      flash();
    } catch (e) { /* clipboard unavailable */ }
  }
}

function logoBytes() {
  try {
    var b64 = EC_LOGO_SRC.split("base64,")[1];
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  } catch (e) { return null; }
}

function downloadResults() {
  var payload = {
    date: todayLabel,
    values: S.finalValues.map(function (v) {
      var a = S.alignment[v.name] || {};
      return {
        name: v.name,
        score: a.score != null ? a.score : "n/a",
        reflection: (a.reflection || "").trim(),
        actions: (S.actions[v.name] || []).filter(function (x) { return x && x.trim(); })
                   .map(function (x) { return x.trim(); })
      };
    })
  };

  var dateStr = new Date().toISOString().slice(0, 10);
  var blob, filename;
  try {
    blob = new Blob([buildDocx(payload, logoBytes())], {
      type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
    });
    filename = "values-review-" + dateStr + ".docx";
  } catch (e) {
    blob = new Blob([buildExportText()], { type: "text/plain" });
    filename = "values-review-" + dateStr + ".txt";
  }

  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function restartWhole() {
  S.screen = "welcome";
  S.cardIndex = 0;
  S.decisions = new Array(deck.length).fill(null);
  S.narrowSteps = [];
  S.narrowStepIndex = 0;
  S.currentPool = [];
  S.selectedInPool = [];
  S.finalValues = [];
  S.alignmentIndex = 0;
  S.alignment = {};
  S.actionsIndex = 0;
  S.actions = {};
  render();
}

/* ============================== render =========================== */

function render() {
  if (S.screen === "welcome") return renderWelcome();
  if (S.screen === "sort") return renderSort();
  if (S.screen === "emptyPile") return renderEmpty();
  if (S.screen === "narrow") return renderNarrow();
  if (S.screen === "alignment") return renderAlignment();
  if (S.screen === "actions") return renderActions();
  if (S.screen === "summary") return renderSummary();
}

function renderWelcome() {
  paint(
    '<h1 class="title">Values Review</h1>' +
    '<div class="lead">' +
      "<p>Values are the qualities you want your life to run on. This short exercise helps you name your top three, look honestly at how closely you have lived by them over the last month, and choose what you will do about it in the month ahead.</p>" +
      "<p>It takes about ten minutes. There are no right answers. Go with your first instinct rather than the answer that sounds impressive.</p>" +
      "<p>This is a reflective coaching exercise rather than a validated psychometric. Nothing you enter here is stored or sent anywhere. When you finish, you can copy or download your results for yourself.</p>" +
    "</div>" +
    '<button class="btn btn-primary" id="begin" type="button">Begin</button>'
  );
  on("begin", "click", function () { S.screen = "sort"; render(); });
}

function renderSort() {
  var card = deck[S.cardIndex];
  paint(
    '<div class="progress">Card ' + (S.cardIndex + 1) + " of " + deck.length + "</div>" +
    '<p class="hint">Sort each value by instinct. You will narrow the list next, so be generous here.</p>' +
    '<div class="card">' +
      '<h2 class="value card-name">' + esc(card.name) + "</h2>" +
      "<p>" + esc(card.descriptor) + "</p>" +
    "</div>" +
    '<div class="stack">' +
      '<button class="btn btn-filled" id="s1" type="button">Important to me</button>' +
      '<button class="btn btn-outline peach" id="s2" type="button">Somewhat important to me</button>' +
      '<button class="btn btn-outline" id="s3" type="button">Not so important to me</button>' +
    "</div>" +
    '<div class="undo-row">' +
      (S.cardIndex > 0 ? '<button class="link" id="undo" type="button">Undo last</button>' : "") +
    "</div>"
  );
  on("s1", "click", function () { sortChoice("important"); });
  on("s2", "click", function () { sortChoice("somewhat"); });
  on("s3", "click", function () { sortChoice("not"); });
  on("undo", "click", undoSort);
}

function renderEmpty() {
  paint(
    '<div class="centre">' +
      '<h2 class="value notice">Nothing marked as important yet</h2>' +
      '<p class="hint">The exercise needs at least one value to work with. Have another go at the sort, and this time mark anything that genuinely matters to you, even loosely.</p>' +
      '<button class="btn btn-primary" id="again" type="button">Run the sort again</button>' +
    "</div>"
  );
  on("again", "click", restartSort);
}

function renderNarrow() {
  var step = activeStep();
  var pills = S.currentPool.map(function (v) {
    var sel = S.selectedInPool.indexOf(v.name) >= 0;
    return '<button class="pill" type="button" data-name="' + esc(v.name) +
      '" aria-pressed="' + (sel ? "true" : "false") + '">' + esc(v.name) + "</button>";
  }).join("");

  paint(
    '<div class="progress" id="narrowProgress">Selected ' + S.selectedInPool.length + " of " + step.target + "</div>" +
    '<p class="instruction">' + esc(step.instruction) + "</p>" +
    '<div class="pills">' + pills + "</div>" +
    '<button class="btn btn-primary" id="narrowContinue" type="button"' +
      (S.selectedInPool.length === step.target ? "" : " disabled") + ">Continue</button>"
  );

  var nodes = content.querySelectorAll(".pill");
  for (var i = 0; i < nodes.length; i++) {
    nodes[i].addEventListener("click", function () {
      togglePill(this.getAttribute("data-name"));
    });
  }
  on("narrowContinue", "click", narrowContinue);
}

function renderAlignment() {
  var v = S.finalValues[S.alignmentIndex];
  var e = alignEntry();
  var scale = "";
  for (var n = 1; n <= 10; n++) {
    scale += '<button class="scale-btn" type="button" data-n="' + n + '" aria-pressed="' +
      (e.score === n ? "true" : "false") + '">' + n + "</button>";
  }

  paint(
    '<div class="progress">Value ' + (S.alignmentIndex + 1) + " of " + S.finalValues.length + "</div>" +
    '<div class="value-head">' +
      '<h2 class="value">' + esc(v.name) + "</h2>" +
      "<p>" + esc(v.descriptor) + "</p>" +
    "</div>" +
    '<p class="prompt">Over the last month, how closely have you lived in line with this value?</p>' +
    '<div class="scale">' + scale + "</div>" +
    '<div class="scale-ends"><span>Rarely</span><span>Consistently</span></div>' +
    '<label class="field" for="reflection">What tells you that? One honest sentence is enough.</label>' +
    '<input class="spaced" type="text" id="reflection" placeholder="Optional" value="' + esc(e.reflection) + '">' +
    '<button class="btn btn-primary" id="alignContinue" type="button"' +
      (e.score == null ? " disabled" : "") + ">Continue</button>"
  );

  var btns = content.querySelectorAll(".scale-btn");
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener("click", function () {
      setScore(Number(this.getAttribute("data-n")));
    });
  }
  on("reflection", "input", function () { alignEntry().reflection = this.value; });
  on("alignContinue", "click", alignContinue);
}

function renderActions() {
  var v = S.finalValues[S.actionsIndex];
  var a = actionEntry();
  var score = (S.alignment[v.name] || {}).score;
  var example = EXAMPLE_ACTIONS[v.name] || "leave the office by 5.30 on Tuesdays and Thursdays";

  paint(
    '<div class="progress">Value ' + (S.actionsIndex + 1) + " of " + S.finalValues.length + "</div>" +
    '<div class="value-head">' +
      '<h2 class="value">' + esc(v.name) + "</h2>" +
      (score != null ? "<p>Alignment last month: " + score + "/10</p>" : "") +
    "</div>" +
    '<p class="brief">Choose one to three actions that would move you closer to this value over the next month. Make each one small enough to actually happen and specific enough that you will know whether you did it.</p>' +
    '<div class="stack" style="margin-bottom:2rem">' +
      '<input type="text" id="a0" value="' + esc(a[0]) + '" placeholder="For example: ' + esc(example) + '">' +
      '<input type="text" id="a1" value="' + esc(a[1]) + '" placeholder="Optional second action">' +
      '<input type="text" id="a2" value="' + esc(a[2]) + '" placeholder="Optional third action">' +
    "</div>" +
    '<button class="btn btn-primary" id="actionsContinue" type="button"' +
      (a[0] && a[0].trim() ? "" : " disabled") + ">Continue</button>"
  );

  [0, 1, 2].forEach(function (i) {
    on("a" + i, "input", function () {
      actionEntry()[i] = this.value;
      if (i === 0) {
        document.getElementById("actionsContinue").disabled = !this.value.trim();
      }
    });
  });
  on("actionsContinue", "click", actionsContinue);
}

function renderSummary() {
  var cards = S.finalValues.map(function (v) {
    var a = S.alignment[v.name] || {};
    var acts = (S.actions[v.name] || []).filter(function (x) { return x && x.trim(); });
    return '<div class="summary-card">' +
      "<h3>" + esc(v.name) + "</h3>" +
      '<p class="summary-score">Alignment last month: ' + (a.score != null ? a.score : "n/a") + "/10</p>" +
      (a.reflection && a.reflection.trim()
        ? '<p class="summary-reflection">' + esc(a.reflection.trim()) + "</p>" : "") +
      '<p class="summary-label">Actions for the next month</p>' +
      "<ol>" + acts.map(function (x) { return "<li>" + esc(x.trim()) + "</li>"; }).join("") + "</ol>" +
    "</div>";
  }).join("");

  paint(
    '<h1 class="title small">Your Values Review</h1>' +
    '<p class="hint">' + esc(todayLabel) + "</p>" +
    '<div class="summary-list">' + cards + "</div>" +
    '<div class="export-row">' +
      '<button class="btn btn-outline blue" id="copyBtn" type="button">Copy results</button>' +
      '<button class="btn btn-outline blue" id="downloadBtn" type="button">Download results</button>' +
    "</div>" +
    '<div class="closing">' +
      "<p>A values audit is a snapshot rather than a verdict. Scores move when actions do. Put these three somewhere you will see them, and bring this summary to your next coaching session if you are working with me.</p>" +
      "<p>If you found this useful, you can find out how we might work together by emailing ella@equilibriacollective.com.au.</p>" +
      '<p class="question">One question to sit with as you close this page. If these three values led every decision you made next month, what would you do differently on Monday?</p>' +
    "</div>" +
    '<div class="centre"><button class="link" id="restart" type="button">Start again</button></div>'
  );
  on("copyBtn", "click", copyResults);
  on("downloadBtn", "click", downloadResults);
  on("restart", "click", restartWhole);
}

render();
</script>
</body>
</html>
